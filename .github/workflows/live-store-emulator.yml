name: Live public catalog emulator test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AvakinRadar_cloudkit/AvakinRadar/app/**"
      - "AvakinRadar_cloudkit/AvakinRadar/build.gradle.kts"
      - "AvakinRadar_cloudkit/AvakinRadar/settings.gradle.kts"
      - ".github/workflows/live-store-emulator.yml"

permissions:
  contents: read

jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run public storefront test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: cd AvakinRadar_cloudkit/AvakinRadar && gradle --no-daemon connectedDebugAndroidTest

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AvakinRadar-live-catalog-test-results
          path: AvakinRadar_cloudkit/AvakinRadar/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
