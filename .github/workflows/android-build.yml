name: AvakinRadar APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o AvakinRadar_project_bundle.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/AvakinRadar_cloudkit/AvakinRadar/app/build.gradle.kts")
          s = p.read_text()

          fix = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          s = s.replace("android {", "android {\n" + fix, 1)
          p.write_text(s)
          print("Java and Kotlin targets aligned to 17")
          PY

      - name: Build debug APK
        working-directory: project/AvakinRadar_cloudkit/AvakinRadar
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AvakinRadar-debug-APK
          path: project/AvakinRadar_cloudkit/AvakinRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
