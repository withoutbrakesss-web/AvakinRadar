name: Avakin Radar Android

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build debug APK
        working-directory: AvakinRadar_cloudkit/AvakinRadar
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AvakinRadar-debug-APK
          path: AvakinRadar_cloudkit/AvakinRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
